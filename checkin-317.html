<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD 317 Check-In</title>
    <style>
        /* --- EXACT MATCH TO GD 202 STYLE --- */
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
            background-color: #f0f2f5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 90vh; 
            margin: 0;
        }
        
        .container { 
            width: 100%; 
            max-width: 400px; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            box-sizing: border-box; 
        }
        
        h2 { 
            margin-top: 0; 
            color: #333; 
        }
        
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 15px 0; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        
        button { 
            width: 100%; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        
        button:disabled { 
            background-color: #ccc; 
        }
        
        .info { 
            background: #eef; 
            padding: 10px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            color: #444; 
            font-size: 0.9em; 
        }
        
        #message { 
            margin-top: 20px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="container" id="main-card">
        <h2>✅ Class Check-In</h2>
        
        <div class="info" id="session-info">
            Loading Class Roster...
        </div>

        <input list="roster-list" id="studentName" placeholder="Start typing your name...">
        <datalist id="roster-list">
            </datalist>

        <button onclick="submitAttendance()" id="submitBtn" disabled>Loading...</button>
        <p id="message"></p>
    </div>

    <script>
        // ==========================================
        // I HAVE INSERTED YOUR URL BELOW:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1Ri-KzxZ7biQaqgZfMyeJfv-06swQf4JIfUAbAKbadXCb00l2iZzmKcRw8KGBUaTD/exec"; 
        // ==========================================

        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session');
        const submitBtn = document.getElementById("submitBtn");

        // 1. Fetch Roster on Load
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(names => {
                const list = document.getElementById("roster-list");
                names.forEach(name => {
                    const option = document.createElement("option");
                    option.value = name;
                    list.appendChild(option);
                });
                
                // Enable UI
                if (sessionId) {
                    document.getElementById("session-info").innerText = "Session: " + sessionId;
                    submitBtn.disabled = false;
                    submitBtn.innerText = "I'm Here";
                } else {
                    document.getElementById("session-info").innerText = "Error: Please scan the QR Code again.";
                    document.getElementById("session-info").style.color = "red";
                }

                const savedName = localStorage.getItem("studentName");
                if (savedName) document.getElementById("studentName").value = savedName;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("session-info").innerText = "Error loading roster. Refresh page.";
            });

        // 2. Submit Logic
        function submitAttendance() {
            const nameInput = document.getElementById("studentName");
            const name = nameInput.value.trim();
            const options = Array.from(document.getElementById("roster-list").options).map(o => o.value);
            
            if (!name) { alert("Please enter your name."); return; }

            if (options.length > 0 && !options.includes(name)) {
               if(!confirm("Name not found in roster. Submit anyway?")) return;
            }

            localStorage.setItem("studentName", name);
            const msg = document.getElementById("message");
            submitBtn.disabled = true;
            submitBtn.innerText = "Checking in...";

            const formData = new URLSearchParams();
            formData.append('name', name);
            formData.append('session', sessionId);

            // --- THE FIX IS HERE ---
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // <--- THIS LINE FIXES "CONNECTION FAILED"
                body: formData 
            }).then(() => {
                submitBtn.style.backgroundColor = "#28a745"; 
                submitBtn.innerText = "Success";
                msg.innerHTML = `<span style="color:green">Checked in as:<br><b>${name}</b></span>`;
            }).catch(error => {
                console.error(error);
                submitBtn.disabled = false;
                submitBtn.innerText = "Try Again";
                msg.innerText = "Connection Failed.";
            });
        }
    </script>
</body>
</html>
