<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Check-In</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 90vh; }
        .container { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        input { width: 90%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; }
        .info { background: #eef; padding: 10px; border-radius: 6px; margin-bottom: 20px; color: #444; font-size: 0.9em; }
        #message { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container" id="main-card">
        <h2>✅ Confirm Attendance</h2>
        
        <div class="info" id="session-info">
            Detecting Session...
        </div>

        <input type="text" id="studentName" placeholder="Enter your Full Name">
        <button onclick="submitAttendance()" id="submitBtn">I'm Here</button>
        <p id="message"></p>
    </div>

    <script>
        // ==========================================
        // PASTE YOUR GOOGLE SCRIPT URL HERE
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQi2HB5J73z345jhht1U5BBqEoxMA_m4iiO9M5Ir6ygO49OSUcZ3c4gQff6VNR4iJing/exec"; 
        // ==========================================

        // 1. Get the Session ID from the URL (The magic part)
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session');

        // 2. Pre-fill Student Name from previous visits (Local Storage)
        const savedName = localStorage.getItem("studentName");
        if (savedName) {
            document.getElementById("studentName").value = savedName;
        }

        // 3. Handle the UI
        if (sessionId) {
            document.getElementById("session-info").innerText = "Session: " + sessionId;
        } else {
            document.getElementById("main-card").innerHTML = "<h3>⚠️ No Session Found</h3><p>Please scan the QR code on the instructor's screen.</p>";
        }

        function submitAttendance() {
            const name = document.getElementById("studentName").value.trim();
            if (!name) {
                alert("Please enter your name.");
                return;
            }

            // Save name for next time
            localStorage.setItem("studentName", name);

            const btn = document.getElementById("submitBtn");
            const msg = document.getElementById("message");
            
            btn.disabled = true;
            btn.innerText = "Checking in...";

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ name: name, sessionId: sessionId })
            }).then(() => {
                btn.style.backgroundColor = "#28a745";
                btn.innerText = "Success";
                msg.innerHTML = `<span style="color:green">You are checked in!</span>`;
            }).catch(error => {
                btn.disabled = false;
                btn.innerText = "Try Again";
                msg.innerText = "Connection Failed.";
            });
        }
    </script>
</body>
</html>
