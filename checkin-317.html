<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD 317 Check-In</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        select { width: 100%; padding: 10px; margin: 20px 0; font-size: 16px; border-radius: 5px; border: 1px solid #ddd; }
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        
        /* Debug Box Styling */
        .debug-info { 
            margin-top: 20px; 
            padding: 10px; 
            background: #ffebee; 
            border: 1px solid #ffcdd2; 
            color: #b71c1c; 
            font-size: 12px; 
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>GD 317 Check-In</h1>
        
        <p>Checking in for: <strong id="display-session" style="color:blue">Searching...</strong></p>

        <select id="name-select">
            <option value="">Loading roster...</option>
        </select>
        <button id="checkin-btn" disabled>Check In</button>
        
        <div id="message"></div>
        
        <div id="debug-box" class="debug-info">Waiting for data...</div>
    </div>

    <script>
        // --- PASTE YOUR GOOGLE SCRIPT URL HERE ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1Ri-KzxZ7biQaqgZfMyeJfv-06swQf4JIfUAbAKbadXCb00l2iZzmKcRw8KGBUaTD/exec"; 
        // -----------------------------------------

        const nameSelect = document.getElementById('name-select');
        const checkinBtn = document.getElementById('checkin-btn');
        const messageDiv = document.getElementById('message');
        const displaySession = document.getElementById('display-session');
        const debugBox = document.getElementById('debug-box');

        // 1. Grab Session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentSession = urlParams.get('session');

        // 2. SHOW IT ON SCREEN (Debugging)
        if (currentSession) {
            displaySession.textContent = currentSession;
            displaySession.style.color = "green";
            debugBox.textContent = "Session Found: " + currentSession;
        } else {
            displaySession.textContent = "MISSING ID";
            displaySession.style.color = "red";
            debugBox.textContent = "ERROR: No 'session' parameter in URL. Scan QR again.";
            checkinBtn.style.display = 'none'; // Hide button if broken
        }

        // 3. Load Roster
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(names => {
                nameSelect.innerHTML = '<option value="">Select your name...</option>';
                names.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    nameSelect.appendChild(option);
                });
                if (currentSession) checkinBtn.disabled = false;
            })
            .catch(error => {
                nameSelect.innerHTML = '<option>Error loading roster</option>';
                debugBox.textContent += " | Roster Error: " + error.message;
            });

        // 4. Send Data
        checkinBtn.addEventListener('click', () => {
            const selectedName = nameSelect.value;
            if (!selectedName) return;

            checkinBtn.disabled = true;
            checkinBtn.textContent = "Sending...";
            
            // Log what we are sending
            const payload = { name: selectedName, session: currentSession };
            debugBox.textContent = "Sending: " + JSON.stringify(payload);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                document.querySelector('.card').innerHTML = `
                    <h1 style="color:green">Success!</h1>
                    <p>Checked in <strong>${selectedName}</strong></p>
                    <p>Session: ${currentSession}</p>
                `;
            }).catch(error => {
                messageDiv.innerHTML = "<span style='color:red'>Failed. See debug box.</span>";
                debugBox.textContent += " | Send Error: " + error.message;
                checkinBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
