<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD 317 Check-In</title>
    <style>
        /* --- EXACT STYLES FROM index.html (GD 202) --- */
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background-color: #e0e7ff; /* The specific blue you like */
            margin: 0; 
        }

        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            text-align: center; 
            width: 90%; 
            max-width: 400px; /* Ensures it looks good on mobile */
        }

        h1 { 
            margin-top: 0; 
            color: #1a237e; /* Indigo Header */
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            font-size: 16px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            background-color: #fff;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #1a237e; /* Indigo Button */
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0d125a;
        }

        button:disabled { 
            background-color: #9fa8da; 
            cursor: not-allowed;
        }

        #message { 
            margin-top: 20px; 
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>GD 317 Check-In</h1>
        <p>Select your name to check in</p>

        <select id="name-select">
            <option value="">Loading roster...</option>
        </select>
        
        <button id="checkin-btn" disabled>Check In</button>
        
        <div id="message"></div>
    </div>

    <script>
        // --- PASTE YOUR GOOGLE SCRIPT URL HERE ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1Ri-KzxZ7biQaqgZfMyeJfv-06swQf4JIfUAbAKbadXCb00l2iZzmKcRw8KGBUaTD/exec"; 
        // -----------------------------------------

        const nameSelect = document.getElementById('name-select');
        const checkinBtn = document.getElementById('checkin-btn');
        const messageDiv = document.getElementById('message');

        // 1. Get Session ID
        const urlParams = new URLSearchParams(window.location.search);
        const currentSession = urlParams.get('session');

        if (!currentSession) {
            messageDiv.innerHTML = "<span style='color:red'>Error: Invalid Session. Scan QR again.</span>";
        }

        // 2. Load Roster
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(names => {
                nameSelect.innerHTML = '<option value="">Select your name...</option>';
                names.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    nameSelect.appendChild(option);
                });
                if (currentSession) checkinBtn.disabled = false;
            })
            .catch(error => {
                nameSelect.innerHTML = '<option>Error loading roster</option>';
            });

        // 3. Send Data (The Form Data Fix)
        checkinBtn.addEventListener('click', () => {
            const selectedName = nameSelect.value;
            if (!selectedName || !currentSession) return;

            checkinBtn.disabled = true;
            checkinBtn.textContent = "Checking in...";

            const formData = new URLSearchParams();
            formData.append('name', selectedName);
            formData.append('session', currentSession);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData 
            }).then(() => {
                // Success Message matches the UI style
                document.querySelector('.card').innerHTML = `
                    <h1 style="color:#1a237e">Success!</h1>
                    <p>You are checked in.</p>
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                `;
            }).catch(error => {
                messageDiv.innerHTML = "<span style='color:red'>Connection failed. Try again.</span>";
                checkinBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
