<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD 317 Check-In</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #333; }
        select { width: 100%; padding: 10px; margin: 20px 0; font-size: 16px; border-radius: 5px; border: 1px solid #ddd; }
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        #message { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>GD 317 Check-In</h1>
        <p>Select your name to check in.</p>
        <select id="name-select">
            <option value="">Loading roster...</option>
        </select>
        <button id="checkin-btn" disabled>Check In</button>
        <div id="message"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // PASTE YOUR NEW WEB APP URL HERE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1Ri-KzxZ7biQaqgZfMyeJfv-06swQf4JIfUAbAKbadXCb00l2iZzmKcRw8KGBUaTD/exec"; 
        // ---------------------

        const nameSelect = document.getElementById('name-select');
        const checkinBtn = document.getElementById('checkin-btn');
        const messageDiv = document.getElementById('message');

        // 1. GET SESSION ID FROM URL (The Fix)
        const urlParams = new URLSearchParams(window.location.search);
        const currentSession = urlParams.get('session');

        if (!currentSession) {
            messageDiv.innerHTML = "<span style='color:red'>Error: Invalid Session. Please scan the QR code again.</span>";
        }

        // 2. LOAD ROSTER
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(names => {
                nameSelect.innerHTML = '<option value="">Select your name...</option>';
                names.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    nameSelect.appendChild(option);
                });
                checkinBtn.disabled = false;
            })
            .catch(error => {
                nameSelect.innerHTML = '<option>Error loading roster</option>';
                console.error('Error:', error);
            });

        // 3. SEND ATTENDANCE
        checkinBtn.addEventListener('click', () => {
            const selectedName = nameSelect.value;
            if (!selectedName) {
                alert("Please select your name.");
                return;
            }
            if (!currentSession) {
                alert("Missing Session ID. Scan the QR code again.");
                return;
            }

            checkinBtn.disabled = true;
            checkinBtn.textContent = "Checking in...";

            const payload = {
                name: selectedName,
                session: currentSession // <--- Sending the ID we caught earlier
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                document.querySelector('.card').innerHTML = `
                    <h1 style="color:green">Success!</h1>
                    <p>You are checked in.</p>
                    <p><strong>${selectedName}</strong></p>
                `;
            }).catch(error => {
                messageDiv.innerHTML = "<span style='color:red'>Connection failed. Try again.</span>";
                checkinBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
