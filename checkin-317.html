<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD 317 Check-In</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 90vh; margin: 0; }
        .container { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; }
        .info { background: #eef; padding: 10px; border-radius: 6px; margin-bottom: 20px; color: #444; font-size: 0.9em; }
        
        /* SUCCESS MESSAGE (Hidden by default) */
        #success-view { display: none; }
        .success-icon { font-size: 50px; color: #28a745; margin-bottom: 20px; }
        .success-text { font-size: 20px; font-weight: bold; color: #333; }
        .success-sub { color: #666; margin-top: 10px; }

        /* VERSION TAG (For Debugging) */
        .version { margin-top: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="form-view">
            <h2>✅ Class Check-In</h2>
            <div class="info" id="session-info">Loading Class Roster...</div>

            <input list="roster-list" id="studentName" placeholder="Start typing your name...">
            <datalist id="roster-list"></datalist>
            
            <button onclick="submitAttendance()" id="submitBtn" disabled>Loading...</button>

            <div class="version" style="color:red; font-weight:bold;">v6.0 - INSTANT MODE</div>
        </div>

        <div id="success-view">
            <div class="success-icon">✅</div>
            <div class="success-text">You're Checked In!</div>
            <div class="success-sub" id="success-details"></div>
            <br>
            <button onclick="location.reload()" style="background:#6c757d; font-size:14px;">Close</button>
        </div>

    </div>

    <script>
        // ==========================================
        // ⬇️ PASTE YOUR GOOGLE SCRIPT URL BELOW ⬇️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1Ri-KzxZ7biQaqgZfMyeJfv-06swQf4JIfUAbAKbadXCb00l2iZzmKcRw8KGBUaTD/exec"; 
        // ==========================================

        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session');
        const submitBtn = document.getElementById("submitBtn");
        const formView = document.getElementById("form-view");
        const successView = document.getElementById("success-view");

        // 1. Fetch Roster
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(names => {
                const list = document.getElementById("roster-list");
                names.forEach(name => {
                    const option = document.createElement("option");
                    option.value = name;
                    list.appendChild(option);
                });
                if (sessionId) {
                    document.getElementById("session-info").innerText = "Session: " + sessionId;
                    submitBtn.disabled = false;
                    submitBtn.innerText = "I'm Here";
                } else {
                    document.getElementById("session-info").innerText = "Error: Please scan QR again.";
                    document.getElementById("session-info").style.color = "red";
                }
                const savedName = localStorage.getItem("studentName");
                if (savedName) document.getElementById("studentName").value = savedName;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("session-info").innerText = "Roster Load Failed";
            });

        // 2. Submit Logic (SILENT MODE: No Alerts, Instant UI)
        function submitAttendance() {
            const name = document.getElementById("studentName").value.trim();
            if (!name) return alert("Enter your name");

            // 1. Lock the Button
            localStorage.setItem("studentName", name);
            submitBtn.innerText = "Done";
            submitBtn.disabled = true;

            // 2. Local Logic (Calculate Status instantly)
            const now = new Date();
            const cutoff = new Date();
            cutoff.setHours(9, 51, 0); // 9:51 AM Cutoff
            let status = (now > cutoff) ? "Late" : "Present";

            // 3. Show Success Screen IMMEDIATELY
            formView.style.display = "none";
            successView.style.display = "block";
            document.getElementById("success-details").innerHTML = "<b>" + name + "</b><br>" + status;

            // 4. Send to Google (Silent Background Send)
            const finalUrl = SCRIPT_URL + "?name=" + encodeURIComponent(name) + "&session=" + encodeURIComponent(sessionId);
            
            fetch(finalUrl, { mode: 'no-cors' })
                .then(() => console.log("Sent successfully"))
                .catch(e => console.error("Silent background error:", e));

            // Stop page reload
            return false;
        }
    </script>
</body>
</html>
