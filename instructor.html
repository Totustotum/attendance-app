<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f6f8; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h1 { margin-top: 0; color: #333; }
        #session-id { font-size: 1.2rem; color: #666; margin-bottom: 20px; font-family: monospace; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Class Attendance</h1>
        <div id="session-id">Generating...</div>
        <div id="qrcode"></div>
        <p>Scan with your native phone camera.</p>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const CLASS_NAME = "GD202"; 
        // IMPORTANT: The link to your student page (index.html)
        // Ensure it ends with a slash / 
        const BASE_URL = "https://totustotum.github.io/attendance-app/"; 
        // ==========================================

        // 1. Get Date and Day Name (e.g., "Thu")
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-CA', { 
            timeZone: 'America/New_York',
            year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' 
        });
        
        // This creates parts like: [{type: "weekday", value: "Thu"}, ...]
        const parts = formatter.formatToParts(now);
        const dayName = parts.find(p => p.type === 'weekday').value; // "Thu"
        const dateStr = parts.find(p => p.type === 'year').value + '-' + 
                        parts.find(p => p.type === 'month').value + '-' + 
                        parts.find(p => p.type === 'day').value;

        // 2. Create Readable Session ID: "GD400-Thu-2026-01-08"
        const sessionId = `${CLASS_NAME}-${dayName}-${dateStr}`;

        // 3. Generate Link & QR
        const deepLink = `${BASE_URL}?session=${sessionId}`;
        document.getElementById("session-id").innerText = sessionId;

        new QRCode(document.getElementById("qrcode"), {
            text: deepLink,
            width: 300,
            height: 300,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
