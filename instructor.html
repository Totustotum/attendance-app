<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f6f8; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h1 { margin-top: 0; color: #333; }
        #session-id { font-size: 1.2rem; color: #666; margin-bottom: 20px; font-family: monospace; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Class Attendance</h1>
        <div id="session-id">Generating...</div>
        <div id="qrcode"></div>
        <p>Scan with your native phone camera.</p>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const CLASS_NAME = "GD202"; 
        // IMPORTANT: The link to your student page (index.html)
        // Ensure it ends with a slash / 
        const BASE_URL = "https://totustotum.github.io/attendance-app/"; 
        // ==========================================

        // --- DATE CONFIGURATION (Forced EST/EDT) ---
        // This forces the format YYYY-MM-DD based on New York time
        const today = new Intl.DateTimeFormat('en-CA', { 
            timeZone: 'America/New_York',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }).format(new Date());
        
        const sessionId = `${CLASS_NAME}-${today}`;
        
        // This creates the magic link: 
        // https://.../?session=GD400-2025-01-04
        const deepLink = `${BASE_URL}?session=${sessionId}`;

        document.getElementById("session-id").innerText = sessionId;

        new QRCode(document.getElementById("qrcode"), {
            text: deepLink, // We are encoding the LINK, not just the ID
            width: 300,
            height: 300,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
