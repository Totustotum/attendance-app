<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD 317 Instructor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* I added a subtle orange tint to the background so you know it's GD 317 */
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #fff3e0; margin: 0; }
        .card { background: white; padding: 60px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; }
        h1 { margin-top: 0; color: #e65100; font-size:48px; font-weight: bold; }
        #session-id { font-size: 1.2rem; color: #666; margin-bottom: 20px; font-family: monospace; line-height: 1.5; }
        #qrcode { display: flex; justify-content: center; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>GD 317 Check-In</h1>
        <div id="session-id">Loading...</div>
        <div id="qrcode"></div>
        <p>Scan to check in</p>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CLASS_NAME = "GD317"; 
        
        // Thursday, Jan 15, 2026
        const START_DATE = new Date("2026-01-15"); 
        
        // IMPORTANT: This points to the file you just created in Phase 3
        const BASE_URL = "https://totustotum.github.io/attendance-app/checkin-317.html"; 
        // ---------------------

        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-CA', { 
            timeZone: 'America/New_York',
            year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' 
        });
        const parts = formatter.formatToParts(now);
        const dayName = parts.find(p => p.type === 'weekday').value; 
        const dateStr = parts.find(p => p.type === 'year').value + '-' + 
                        parts.find(p => p.type === 'month').value + '-' + 
                        parts.find(p => p.type === 'day').value;

        // Calculate Week Number
        const diffInMs = now - START_DATE;
        const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
        let weekText = "Pre-Semester";
        if (diffInDays >= 0) {
            weekText = "Week " + (Math.floor(diffInDays / 7) + 1);
        }

        const sessionId = `${CLASS_NAME}-${dayName}-${dateStr}`;

        // Display the Week and ID
        document.getElementById("session-id").innerHTML = 
            `<strong style="font-size:2em; color:#e65100">${weekText}</strong><br>${sessionId}`;

        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: `${BASE_URL}?session=${sessionId}`,
            width: 300, 
            height: 300, 
            colorDark : "#000000", 
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
